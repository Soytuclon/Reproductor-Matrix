<!-- Fondo animado de Matrix -->
<canvas id="matrix-bg"></canvas>

<div class="player-card matrix-theme">
  <div class="matrix-display">
    <div class="song-info">
      <h1 id="song-title">MATRIX TERMINAL v5.0</h1>
      <p id="artist-name">Cargando sistema...</p>
    </div>
    
    <!-- ECUALIZADOR VISUAL -->
    <div class="visualizer-container" id="visualizer"></div>
  </div>
  
  <!-- MODIFICADORES DE SONIDO -->
  <div class="audio-controls">
    <div class="control-group">
      <label for="pitch-slider">🎚️ Velocidad / Tono</label>
      <input type="range" id="pitch-slider" min="0.5" max="2" step="0.1" value="1">
    </div>
    <div class="control-group">
      <label for="distortion-slider">⚡ Distorsión Cypher</label>
      <input type="range" id="distortion-slider" min="0" max="100" step="5" value="0">
    </div>
  </div>

  <!-- CONTROLES PRINCIPALES DE PLAYLIST -->
  <div class="controls">
    <button class="control-btn" id="prev-btn">⏮️</button>
    <button class="control-btn play-btn" id="play-btn">▶️ RUN</button>
    <button class="control-btn" id="next-btn">⏭️</button>
  </div>
  
  <!-- SELECCIÓN DE MODO E IMPORTADOR -->
  <div class="import-container">
    <label for="audio-file" class="import-label">📂 O Cargar archivo propio .MP3</label>
    <input type="file" id="audio-file" accept="audio/*">
  </div>
  
  <p class="nota-seguridad">SISTEMA PLAYLIST CORE v5.0</p>
</div>

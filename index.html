<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Reproductor Matrix</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <!-- Fondo animado de Matrix -->
<canvas id="matrix-bg"></canvas>

<div class="player-card matrix-theme">
  <div class="matrix-display">
    <div class="song-info">
      <h1 id="song-title">MATRIX TERMINAL v4.0</h1>
      <p id="artist-name">Estado: Esperando archivo...</p>
    </div>
    
    <!-- ECUALIZADOR VISUAL (BARRAS DIGITALES) -->
    <div class="visualizer-container" id="visualizer">
      <!-- Las barras se generarán dinámicamente con JavaScript -->
    </div>
  </div>
  
  <!-- MODIFICADORES DE SONIDO -->
  <div class="audio-controls">
    <div class="control-group">
      <label for="pitch-slider">🎚️ Velocidad / Tono</label>
      <input type="range" id="pitch-slider" min="0.5" max="2" step="0.1" value="1">
    </div>
    <div class="control-group">
      <label for="distortion-slider">⚡ Distorsión Cypher</label>
      <input type="range" id="distortion-slider" min="0" max="100" step="5" value="0">
    </div>
  </div>

  <!-- CONTROLES -->
  <div class="controls">
    <button class="control-btn play-btn" id="play-btn">▶️ RUN</button>
  </div>
  
  <!-- IMPORTADOR -->
  <div class="import-container">
    <label for="audio-file" class="import-label">📂 Cargar Archivo .MP3 / .WAV</label>
    <input type="file" id="audio-file" accept="audio/*">
  </div>
  
  <p class="nota-seguridad">SISTEMA CONECTADO AL CORE</p>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
